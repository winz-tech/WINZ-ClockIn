<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>穎利科技｜作業中心</title>
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="穎利ERP">
<!-- ★2026/09/21 v6g　預先連線：頁面一開就先跟 Google 握手，第一趟 fetch／iframe 不用再等 TLS。
     validate 是 ContentService，會 302 到 script.googleusercontent.com，所以兩個都要。 -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<!-- ★2026/09/17　分頁圖示。以前頂層是 script.google.com，只能用 Google 的圖示；
     現在頂層停在自己家，這一行才生效。 -->
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
    /* ★2026/09/17　拿掉 max-width:1180px。
     原本的用意是「打卡頁在電腦上不要整片攤開」，但打卡頁自己就有
     #app-wrap{width:390px;margin:0 auto} 在置中 —— 外殼這層限寬是多餘的，
     卻會把作業中心（本來就要滿版的寬版面）壓成中間一塊、兩邊黑、多一條捲軸。 */
  #pad{position:fixed;inset:0;
    padding-top:env(safe-area-inset-top,0px);
    background:#0a0a0c}
  #frame{width:100%;height:100%;border:0;display:block;background:#0a0a0c}
  #veil{position:fixed;inset:0;z-index:10;background:#0a0a0c;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    transition:opacity .4s ease;padding:24px;text-align:center}
  #veil.hide{opacity:0;pointer-events:none}
  .spin{width:42px;height:42px;border:3px solid #2a2a30;border-top-color:#E30613;
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px}
  .s{color:#8a8a92;font-size:13px;line-height:1.8}
  .btn{display:none;margin-top:6px;padding:14px 38px;border:0;cursor:pointer;
    text-decoration:none;border-radius:8px;font-family:inherit;
    background:linear-gradient(135deg,#E30613,#8f0009);color:#fff;
    font-size:16px;font-weight:bold;letter-spacing:3px;
    box-shadow:0 0 20px rgba(227,6,19,.4)}
  .btn.on{display:inline-block}

  /* ★2026/09/21 v6f　開機畫面（splash）。
     正常載入時殼這一層不是「loading」，是「App 正在啟動」——
     跟內層那個 loading 做的不是同一件事，就不要長得一樣，不然人會數「一個、兩個」。
     ⚠ 只改正常載入的樣子；所有錯誤畫面（逾時／失敗／未登入）完全照舊。 */
  #splashLogo,.bar,.slow{display:none}
  #veil.splash #splashLogo{display:block}
  #veil.splash .bar{display:block}
  #veil.splash .spin,#veil.splash .t,#veil.splash .s,#veil.splash .btn{display:none}
  #veil.splash.slow .slow{display:block}
  #splashLogo{width:auto;height:56px;max-width:70vw;object-fit:contain;
    filter:drop-shadow(0 0 14px rgba(227,6,19,.5));
    animation:logoIn .6s ease-out both}
  @media (max-width:480px){ #splashLogo{height:44px} }
  @keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .bar{width:120px;height:2px;border-radius:2px;overflow:hidden;background:#1e1e24}
  .bar i{display:block;width:40%;height:100%;border-radius:2px;
    background:linear-gradient(90deg,transparent,#E30613,transparent);
    animation:barRun 1.1s ease-in-out infinite}
  @keyframes barRun{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .slow{color:#6a6a72;font-size:12px;letter-spacing:2px;animation:logoIn .4s ease-out both}
  @media (prefers-reduced-motion:reduce){
    #splashLogo,.slow{animation:none}
    .bar i{animation-duration:2.4s}
  }

  /* ★2026/09/21　量測品：殼的版號戳章。穩定之後整段拿掉（連同 body 裡的 #shellStamp）。 */
  #shellStamp{position:fixed;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);
    z-index:20;pointer-events:none;
    font:10px/1.2 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<!-- ★2026/09/17　allow 一定要列權限 —— 跨來源 iframe 預設什麼都沒有。
     09/17 早上全公司打不了卡，就是因為這裡少了 geolocation：
     打卡頁拿不到定位，畫面只能說「請開啟定位權限」，而使用者去設定裡開一百次也沒用。
     ⚠ 這些權限是綁【頂層網域】的。進殼之後頂層從 script.google.com 變成
       winz-tech.github.io，所以每個人都會被【重新問一次】。這一下逃不掉，上線前要先講。
     ⚠ camera 先放進來：掃碼、拍照那幾支專案以後進殼會用到。
       沒有用到的權限不會自己彈窗，多列不會打擾人；少列才會悄悄壞掉。 -->
<div id="pad"><iframe id="frame" title="穎利科技作業中心"
        referrerpolicy="no-referrer-when-downgrade"
        allow="geolocation; camera; clipboard-write"></iframe></div>

<!-- ★ v6f　一開始就是 splash，第一格畫面不會再閃「連線中…」
     ★ LOGO 用根目錄路徑：portal/ 和 WINZ-ClockIn/ 兩個殼讀同一張；讀不到退回 icon-192.png -->
<div id="veil" class="splash">
  <img id="splashLogo" src="/portal/winz-logo.png" alt="穎利科技 WINZ"
       onerror="this.onerror=null;this.src='winz-logo.png'">
  <div class="bar"><i></i></div>
  <div class="slow">連線中…</div>
  <div class="spin" id="spin"></div>
  <div class="t" id="msg"></div>
  <div class="s" id="sub"></div>
  <a class="btn" id="go" href="index.html">前往登入</a>
</div>

<div id="shellStamp"></div>

<script>
/* ════════════════════════════════════════════════════════════
   app.html　外殼　v6g　2026/09/21
   ── portal/ 與 WINZ-ClockIn/ 放的是「同一份檔案」，沒有寫死資料夾名字。

   在做什麼：把 GAS 包進 iframe，頂層永遠停在 winz-tech.github.io。
     ① iOS 不會再開「App 內臨時瀏覽器」→ 票、裝置ID、推播訂閱記得住
     ② script.google.com 那條白色橫幅只在頂層才長得出來 → 包進來就沒了
     ③ ★ 每次載入都現拿一張新鮮的 rc 注進 iframe ——
        內層那個 googleusercontent origin 的 localStorage 就算被 iOS 清掉也沒差。

   ══ v6g（2026/09/21）══ 開機變快
     ① 首頁交棒：index.html 已經 validate 過一次、手上有一張 rc，
        以前丟掉，殼再問一次 → 每次進系統白白多一趟 GAS。
        現在首頁把 rc 放在 #rc=…&at=… 交給殼（# 後面不會送到伺服器），
        殼第一次載入直接用，不再 fetch。
        ⚠ 超過 30 秒的交棒不用（中間可能卡在推播詢問卡），自己重拿。
        ⚠ 一讀到就把 # 從網址列抹掉 —— 燒過的碼不能留在會被重讀的地方。
     ② 內層 shell-ping 一到就收開機畫面（作業中心／PIN 頁會報到），
        不必等 iframe 所有圖片字型都載完。打卡頁不報到 → 照舊等 load。
     ③ preconnect 預先跟 Google 握手。
     ④ 戳章多印「驗」「開」兩個秒數（量測品）。

   ══ v6f（2026/09/21）══ 開機畫面：LOGO + 細光條；超過 4 秒才冒「連線中…」；錯誤畫面照舊。
   ══ v6e（2026/09/21）══ PIN 頁自己報到 shell-ping {home:'pin'}。
   ══ v6d（2026/09/21）══ J 的病根：燒過的 rc 黏在 ?go= 上 → 一律刮掉；
       內層自帶 rc 原封不動用；PIN 工作階段睡醒／沒票一律回人頭頁；撤掉 WZ_PAD 判斷。
   ══ v6 （2026/09/21）══ 睡醒重載：殼接 visibilitychange / pageshow。
   ══ v5 （2026/09/16）══ SHELL_OK 加作業中心；?go=；shell-ping → shell-here（帶白名單）。

   詳見專案文件 claude/外殼v6-平板睡醒回人頭頁-2026-09-21.md

   ⚠ 內層 GAS 的每個 page 分支都要有
     .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
     否則那一頁在殼裡會是一片空白。
   ════════════════════════════════════════════════════════════ */
(function(){
  var SHELL_VER = 'v6g';
  var PUNCH = 'https://script.google.com/a/macros/winz-tech.com/s/AKfycbxUDyY2BWgoYF4fbEOCBMnw-bmz-1KxogCpvtezgZboiuC9S04oHNnhkVPXb3Kg6Gp3/exec';
  // ★ 只准載自己人，而且只認「已經加過 ALLOWALL 的專案」。
  //   沒加那一行的專案嵌進來會是一片空白 —— 比掀殼更糟。
  //   之後每確認一支，就把部署碼加進這個陣列。
  var SHELL_OK = [
    'AKfycbxUDyY2BWgoYF4fbEOCBMnw-bmz-1KxogCpvtezgZboiuC9S04oHNnhkVPXb3Kg6Gp3', // 09-人事管理-考勤薪資系統
    'AKfycbzSn9xYdkf7bVZIaPe8XtrKMPdsdegPtV3kZZ72QJ44GJE9RHBal29SsE9K7ekREXUwWQ', // 作業中心（2026/09/16 加）
    // ★2026/09/18　領料單專案（現場平板 PIN、發料登記、退料單）。
    //   doGet 的 _render() 每一頁都有 ALLOWALL，已逐條確認。
    'AKfycbzjZnB5yGU4416GcuR8dpzn0_1SijpF6Aj3o_rTpmPCoa_Sz5ucmb89ulteF8bDwfeB'    // 領料單（2026/09/18 加）
  ];

  // ★2026/09/21 v6d　PIN 人頭頁（跟 portal/index.html 的 PIN_URL 同一個）
  var PIN_ID  = 'AKfycbzjZnB5yGU4416GcuR8dpzn0_1SijpF6Aj3o_rTpmPCoa_Sz5ucmb89ulteF8bDwfeB';
  var PIN_URL = 'https://script.google.com/a/macros/winz-tech.com/s/' + PIN_ID + '/exec?page=field-pin';

  var frame = document.getElementById('frame');
  var veil  = document.getElementById('veil');
  var spin  = document.getElementById('spin');
  var msg   = document.getElementById('msg');
  var sub   = document.getElementById('sub');
  var go    = document.getElementById('go');

  // ★2026/09/21 v6g　首頁交棒的 rc（只給第一次載入用）
  //   格式：app.html?go=…#rc=XXXX&at=<毫秒時間戳>
  var HANDOFF = '';
  (function(){
    try {
      var h  = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
      var rc = h.get('rc') || '';
      var at = Number(h.get('at') || 0);
      if (rc && at > 0 && (Date.now() - at) < 30000) HANDOFF = rc;
    } catch(e){}
    // ★ 不管用不用，# 一律先抹掉 —— 燒過的碼不能留在網址列（重整會重送）
    if (location.hash) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    }
  })();

  function getCk(k){
    try { var m = document.cookie.match('(^|;)\\s*' + k + '\\s*=\\s*([^;]+)');
          return m ? decodeURIComponent(m.pop()) : ''; }
    catch(e){ return ''; }
  }

  // ★2026/09/21 v6f　正常載入 → 開機畫面。超過 4 秒才補一行「連線中…」。
  var _slowT = null;
  function showSplash(){
    clearTimeout(_slowT);
    go.classList.remove('on');
    veil.classList.remove('hide', 'slow');
    veil.classList.add('splash');
    _slowT = setTimeout(function(){ veil.classList.add('slow'); }, 4000);
  }
  // 錯誤畫面（逾時／失敗／未登入…）→ 收起開機畫面，文字 + 按鈕，跟以前一樣。
  function showVeil(title, detail, btnText, btnHref){
    clearTimeout(_slowT);
    _awaitFrame = false;
    veil.classList.remove('splash', 'slow');
    spin.style.display = detail ? 'none' : '';
    msg.textContent = title;
    sub.innerHTML = detail || '';
    if (btnText){ go.textContent = btnText; go.setAttribute('href', btnHref || 'index.html'); go.classList.add('on'); }
    else { go.classList.remove('on'); }
    veil.classList.remove('hide');
  }
  function hideVeil(){
    clearTimeout(_slowT);
    veil.classList.add('hide');
  }

  function safeUrl(u){
    u = String(u || '');
    if (u.indexOf('https://script.google.com/') !== 0) return '';
    var id = (u.match(/\/s\/([^\/?]+)/) || [])[1] || '';       // ★ 比部署碼不比網址（【坑L】）
    return (SHELL_OK.indexOf(id) > -1) ? u : '';
  }

  // ★2026/09/21 v6d　把網址上所有 rc= 刮掉。
  //   rc 用過即焚，留在任何會被「重讀」的地方（?go=、iframe src）都是定時炸彈。
  //   ⚠ 前面一定要是 ? 或 &，才不會誤刮到 src= 之類的參數。
  function stripRc(u){
    return String(u || '')
      .replace(/([?&])rc=[^&#]*(&?)/g, function(m, p, amp){ return amp ? p : ''; })
      .replace(/[?&]$/, '');
  }
  function hasRc(u){ return /[?&]rc=[^&#]/.test(String(u || '')); }
  function addRc(u, rc){ return u + (u.indexOf('?') > -1 ? '&' : '?') + 'rc=' + encodeURIComponent(rc); }

  // ★2026/09/21 v6d　是不是 PIN 人頭頁（比部署碼 + page=field-pin）
  function isPinUrl(u){
    u = String(u || '');
    var id = (u.match(/\/s\/([^\/?]+)/) || [])[1] || '';
    return id === PIN_ID && /[?&]page=field-pin(&|#|$)/.test(u);
  }

  function outerPage(){
    try { return new URLSearchParams(location.search).get('page') || 'punch'; }
    catch(e){ return 'punch'; }
  }
  // ★2026/09/16　?go=<完整 GAS 網址>：外層直接指定要載哪一支。
  //   仍然要過 safeUrl 白名單 —— 這是給自己家連結用的，不是開放跳轉。
  function outerGo(){
    try { return new URLSearchParams(location.search).get('go') || ''; }
    catch(e){ return ''; }
  }

  // ★2026/09/21 v6d/v6e　這個殼是不是「PIN 工作階段」。
  //   來源：PIN 頁報到（主要）／殼載過 PIN 頁／網址列 &home=pin（重整不丟）。
  var PIN_HOME = false;
  try { PIN_HOME = new URLSearchParams(location.search).get('home') === 'pin'; } catch(e){}
  if (isPinUrl(outerGo())) PIN_HOME = true;

  // 網址列只寫【乾淨的】網址，PIN 工作階段多掛 &home=pin
  function markGo(cleanUrl){
    try { history.replaceState(null, '', '?go=' + encodeURIComponent(cleanUrl)
                                         + (PIN_HOME ? '&home=pin' : '')); } catch(e){}
  }

  var watchdog = null;
  var _lastRelogin = 0;   // ★ shell-relogin 冷卻（見下方 message 處理）
  var _netTry = 0;        // ★ 連線重試次數（見 load 的 catch）

  // ★2026/09/21　睡醒重載：離開多久才算「睡過一覺」，短暫切出去不算。
  //   ⚠ 測試時可暫時改成 20000（20 秒），驗完務必改回來。
  var WAKE_MS = 10 * 60 * 1000;
  var _hidAt  = 0;

  // ★2026/09/21 v6g　量測：這一輪載入花在哪。
  var _t0 = 0;             // 開始載入
  var _tVal = '';          // 驗：殼問後端花多久（或「交棒」）
  var _tOpen = '';         // 開：從開始到畫面可用
  var _awaitFrame = false; // 已經設了 frame.src、還在等內層出現
  function secs(ms){ return (ms / 1000).toFixed(1) + 's'; }

  // ★2026/09/21　量測品：版號戳章。穩定之後整支拿掉。
  var _stampExtra = '';
  function stamp(extra){
    if (extra !== undefined) _stampExtra = extra;
    var el = document.getElementById('shellStamp');
    if (!el) return;
    el.textContent = 'shell ' + SHELL_VER
                   + ' · home=' + (PIN_HOME ? 'PIN' : '--')
                   + (_tVal  ? ' · 驗' + _tVal  : '')
                   + (_tOpen ? ' · 開' + _tOpen : '')
                   + (_stampExtra ? ' · ' + _stampExtra : '');
  }

  function armWatchdog(){
    clearTimeout(watchdog);
    watchdog = setTimeout(function(){
      showVeil('連線逾時', '網路慢或系統忙碌，<br>可以再試一次。', '重新載入', 'javascript:location.reload()');
    }, 20000);
  }

  // 設 iframe 並開始等它出現
  function setFrame(u){
    _awaitFrame = true;
    frame.src = u;
  }
  // ★ v6g　內層出現了（shell-ping 或 iframe load，誰先到算誰）→ 收開機畫面
  function frameReady(){
    if (!_awaitFrame) return;
    _awaitFrame = false;
    clearTimeout(watchdog);
    if (_t0) { _tOpen = secs(Date.now() - _t0); stamp(); }
    setTimeout(hideVeil, 150);
  }

  function load(url){
    var want   = url || outerGo();
    var target = want ? safeUrl(want) : (PUNCH + '?page=' + encodeURIComponent(outerPage()));
    if (!target){
      showVeil('無法開啟', '這個位置不在允許範圍內。', '回首頁', 'index.html');
      return;
    }
    target = stripRc(target);          // ★ v6d　舊網址上可能還黏著燒過的碼，接新的之前先刮乾淨
    if (isPinUrl(target) && !PIN_HOME){ PIN_HOME = true; }
    _t0 = Date.now(); _tVal = ''; _tOpen = ''; stamp();
    showSplash();
    armWatchdog();

    var tok = getCk('WZ_TOKEN_CK');
    if (!tok){
      clearTimeout(watchdog);
      showVeil('尚未登入', '請先從首頁登入一次，<br>之後這裡就會自動進入。', '前往登入', 'index.html');
      return;
    }

    // ★ v6g　首頁交棒：直接用，不再問後端。只用一次。
    if (HANDOFF){
      var hc = HANDOFF; HANDOFF = '';
      _tVal = '交棒'; stamp();
      _netTry = 0;
      setFrame(addRc(target, hc));
      return;
    }

    // ★ 每次載入都跟後端要一張新鮮的接力碼。rc 只活 60 秒、用過即焚。
    fetch(PUNCH + '?page=validate&t=' + encodeURIComponent(tok) + '&fresh=1')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok){
          clearTimeout(watchdog);
          showVeil('登入已失效', '請重新登入一次。', '前往登入', 'index.html');
          return;
        }
        _tVal = secs(Date.now() - _t0); stamp();
        var u = target;
        if (d.rc) u = addRc(u, d.rc);
        _netTry = 0;                    // ★ 通了就歸零
        setFrame(u);
      })
      .catch(function(){
        clearTimeout(watchdog);
        // ★2026/09/20　不要第一次就放棄。
        //   平板放著幾十分鐘、螢幕關著，Wi-Fi 多半是斷的或在省電；
        //   一按開機鍵殼就發 fetch，那一刻網路還沒接回來 —— 這不是「連線失敗」，
        //   是「太早問」。等一下再問就好了。
        //   ⚠ 退避遞增，最多 3 次（約 9 秒）。真的不行才把畫面交給人。
        if (_netTry < 3) {
          _netTry++;
          showSplash();                 // 維持開機畫面，不要嚇到現場
          setTimeout(function(){ load(url); }, 1500 * _netTry);
          return;
        }
        _netTry = 0;
        showVeil('連線失敗', '請確認網路後再試一次。', '重新載入', 'javascript:location.reload()');
      });
  }

  // ★2026/09/21 v6d　內層自己帶了 rc（身分交接，例如 PIN 頁的人頭卡）→ 原封不動用它。
  //   原本殼會再接一張自己的，但 GAS 只認第一張 = 內層那張，所以身分跟原本一模一樣。
  function loadAsIs(u){
    _t0 = Date.now(); _tVal = '內層'; _tOpen = ''; stamp();
    showSplash();
    armWatchdog();
    _netTry = 0;
    setFrame(u);
  }

  // ★2026/09/21 v6d　回人頭頁：用殼的 cookie（設備帳號）換新碼載 PIN 頁。
  function goHome(){
    PIN_HOME = true;
    markGo(PIN_URL);
    load(PIN_URL);
  }

  frame.addEventListener('load', function(){
    if (!frame.src || frame.src === 'about:blank') return;
    frameReady();
  });

  // ── ★2026/09/21　睡醒重載 ──────────────────────────────────
  //   iOS 喚醒被凍結的分頁時，是照著 iframe 現有的 src 重新載入一次 ——
  //   而殼的 JS 沒有重跑，沒有人會去拿新的碼。這兩個事件是殼唯一的醒來訊號。
  function wake(){
    if (!_hidAt) return;
    var away = Date.now() - _hidAt;
    _hidAt = 0;
    if (away < WAKE_MS) return;              // ⚠ 切出去看個訊息就回來 → 不動它。
                                             //   現場填到一半的發料登記不能被洗掉。
    _lastRelogin = Date.now();               // ★ 剛注完新碼，壓住內層 30 秒內的 shell-relogin
    _netTry = 0;

    // ★ PIN 工作階段（共用平板）：睡醒一律回人頭頁。
    //   離開這麼久，拿著平板的多半已經不是同一個人了。
    if (PIN_HOME){
      stamp('醒:回人頭');
      goHome();
      return;
    }
    if (!getCk('WZ_TOKEN_CK')) { stamp('醒:無cookie'); return; }
                                             // ⚠ 沒有第一方 cookie 就不要碰。
                                             //   不然 cookie 過期但內層還活著的人，
                                             //   會被我們從「還能用」打成「尚未登入」—— 那是新病。
    stamp('醒:重載');
    load();                                  // 不帶參數 → 從網址列重新推導（已是乾淨網址）
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) _hidAt = Date.now(); else wake();
  });
  window.addEventListener('pageshow', function(ev){
    if (ev && ev.persisted) wake();          // 從 bfcache 還原：一定先 hidden 過，_hidAt 有值
  });

  // ── 內層喊話 ────────────────────────────────────────────────
  window.addEventListener('message', function(ev){
    var o = ev.origin || '';
    if (!/\.googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
    var d = ev.data; if (!d) return;

    // ★2026/09/16　「有沒有殼？」內層開頁問一次。
    //   ★★ 連白名單一起交出去 —— 內層必須在「手指按下去的那一瞬間、同步」
    //      就知道這個網址殼接不接得住，不能先問再等（iOS 會吞掉脫離手勢的導航）。
    //   ⚠ 回 shell-here 不回 shell-ack：01-auth 的 wzGo 在等 shell-ack，
    //      借用同一個字會讓它誤判「殼接住了」。
    if (d.wz === 'shell-ping'){
      try { ev.source.postMessage({ wz:'shell-here', ok: SHELL_OK.slice() }, o); } catch(e){}
      // ★2026/09/21 v6e　PIN 頁報到：「我是人頭頁」。
      //   作業中心把平板送去 PIN 頁是在 iframe 裡自己換頁，殼看不到（v6d 實測 home=--）。
      //   所以改由 PIN 頁自己說。到了就記住：這是 PIN 工作階段，家在人頭頁。
      if (d.home === 'pin'){
        PIN_HOME = true;
        markGo(PIN_URL);
      }
      // ★2026/09/21 v6g　內層已經跑起來了 → 收開機畫面，不必等所有圖片字型
      frameReady();
      stamp();
      return;
    }

    // ★2026/09/20　內層喊「我沒票了」→ 殼重新載入，注一張新鮮的 rc。
    //   ⚠ 一定要有冷卻：殼重載 → 內層還是沒票 → 又喊 → 無限迴圈。30 秒內只受理一次。
    //   ⚠ 不要回 ack —— wzGo 在等 shell-ack，回了會讓它誤判。
    //   ★2026/09/21 v6d　PIN 工作階段 → 回人頭頁（人的票 30 分鐘到期就是走這條）。
    if (d.wz === 'shell-relogin'){
      var _nowT = Date.now();
      if (_nowT - _lastRelogin < 30000) return;
      _lastRelogin = _nowT;
      if (PIN_HOME) { stamp('沒票:回人頭'); goHome(); }
      else          { stamp('沒票:重載');   load();   }
      return;
    }

    if (d.wz === 'shell-nav'){
      var u = safeUrl(d.url);
      // ★ 不在名單上就「不要回 ack」——讓內層逾時後自己頂層跳出去。
      if (!u) return;
      try { ev.source.postMessage({ wz:'shell-ack' }, o); } catch(e){}
      if (isPinUrl(u)) PIN_HOME = true;
      // ★ v6d　網址列只寫乾淨的網址 —— 這一行就是 J 的解藥
      markGo(stripRc(u));
      _stampExtra = '';
      if (hasRc(u)) loadAsIs(u);             // 內層自己帶了身分 → 原封不動用
      else          load(u);                 // 沒帶 → 殼用 cookie 換一張
      return;
    }

    if (d.wz === 'shell-logout'){
      try { ev.source.postMessage({ wz:'shell-ack' }, o); } catch(e){}
      frame.src = 'about:blank';
      location.replace('index.html?logout=1');
      return;
    }
  });

  // 開機時網址列可能還是舊版殼寫的髒網址 → 先洗乾淨
  if (outerGo() && hasRc(outerGo())) markGo(stripRc(outerGo()));
  stamp();
  load();
})();
</script>
